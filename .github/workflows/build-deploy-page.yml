name: Build and Deploy GitHub Page

on:
  workflow_run:
    workflows: ["Build and Release Firmware", "Update Builds in Release"]
    types:
      - completed
  push:
    branches: [ 'main' ]
  # Start a manual run on main: the github-pages environment only accepts deployments from
  # the default branch, so a dispatch from another branch builds the site but cannot publish.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # the gate reads workflow-run status

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site must not advertise a version whose firmware is not published yet: the flasher and the
  # firmware page read firmware-info.json from this site, so publishing early shows a new version
  # with nothing behind it.  Both firmware workflows trigger this one when they complete, so a run
  # here can stand aside and the site still ends up deployed.  workflow_dispatch is the deliberate
  # override for when this gate is wrong.
  firmware-gate:
    name: Firmware release gate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check the advertised version has a complete release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          VERSION_FILE="builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          [ -f "$VERSION_FILE" ] || VERSION_FILE="builds/releases/web_assets/firmware-info.json"
          RADIOVERSION=$(grep -oP '#define RADIOVERSION "\K[^"]+' src/core/options.h)
          VERSION=$(jq -r '.version // empty' "$VERSION_FILE" 2>/dev/null || true)
          VERSION=${VERSION:-$RADIOVERSION}
          echo "advertised version ${VERSION}, RADIOVERSION ${RADIOVERSION}, from ${VERSION_FILE}"

          # A tag build or a manual run of either firmware workflow deploys the site itself when it
          # finishes, so a push run only has to stand aside while one is working.  The first pause
          # lets a run started by the same push register; a read error counts as nothing running,
          # so a flaky API can never wedge the site.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            for pause in 30 15 15; do
              sleep "$pause"
              RUNNING=""
              for wf in build-release-firmware.yml update-builds-in-release.yml; do
                COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=20" \
                  --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
                if [ "${COUNT:-0}" -gt 0 ]; then RUNNING="${RUNNING} ${wf}"; fi
              done
              if [ -n "$RUNNING" ]; then
                echo "::notice title=Firmware build running::${RUNNING# } is running, and its completion deploys the site"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi

          # The release test is the one update-builds-in-release.yml uses to decide a release is
          # complete: every app image named in firmware.txt.  Bootloader, partitions and filesystem
          # images are only reported, because the build workflows treat those as warnings.
          ASSETS_FILE=$(mktemp)
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$ASSETS_FILE" 2>/dev/null; then
            echo "::notice title=No release ${VERSION}::release ${VERSION} does not exist yet, so the site keeps its current version"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MISSING=""
          while IFS='|' read -r board_env chip_family fw_env friendly_name; do
            [ -n "${fw_env:-}" ] || continue
            grep -qx "${fw_env}.bin" "$ASSETS_FILE" || MISSING="${MISSING} ${fw_env}.bin"
          done < builds/releases/firmware.txt

          if [ -n "$MISSING" ]; then
            echo "::notice title=Release ${VERSION} is incomplete::missing${MISSING}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk -F'|' '{print $1}' builds/releases/firmware.txt | sort -u | while read -r board_env; do
            for kind in bootloader partitions filesystem; do
              grep -qx "${board_env}_${kind}.bin" "$ASSETS_FILE" \
                || echo "::warning title=Release ${VERSION}::${board_env}_${kind}.bin is missing (non-blocking)"
            done
          done

          echo "✅ release ${VERSION} carries every app image, deploying the site"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build-deploy:
    needs: firmware-gate
    if: always() && needs.firmware-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs-material==9.7.7

      - name: Stage docs from README
        run: |
          mkdir -p docs
          cp README.md docs/index.md
          for f in *.md; do
            [ "$f" != "README.md" ] && cp "$f" docs/
          done
          cp -r images docs/

      - name: Update GitHub link in documentation index
        run: |
          # Replace only the first occurrence of 'Github Page' with 'Github Repository'
          sed -i '0,/Github Page/s|Github Page|Github Repository|' docs/index.md
          # Replace only the first occurrence of the link after that phrase with the correct repo link
          sed -i "0,/(https:\/\/[^)]*)/s|(https://[^)]*)|(https://github.com/${{ github.repository }})|" docs/index.md
          # Replace only the first occurrence of 'easier to read' with 'easier to explore'
          sed -i '0,/easier to read/s|easier to read|easier to explore|' docs/index.md

      - name: Fix MkDocs cross-references
        run: |
          for f in docs/*.md; do
            sed -i 's|](README.md|](index.md|g' "$f"
            sed -i 's|](docs/|](|g' "$f"
          done

      - name: Copy web assets (manifests and firmware-info.json)
        run: |
          LOCAL_ASSETS="builds/${{ github.repository_owner }}/web_assets"
          if [ ! -d "$LOCAL_ASSETS" ]; then
            LOCAL_ASSETS="builds/releases/web_assets"
          fi
          LOCAL_JSON="$LOCAL_ASSETS/firmware-info.json"
          PUBLISHED_JSON=$(mktemp)
          PRESERVE_PUBLISHED=false
          if curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/firmware-info.json" -o "$PUBLISHED_JSON" 2>/dev/null; then
            if [ -f "$LOCAL_JSON" ] && ! diff -q "$LOCAL_JSON" "$PUBLISHED_JSON" > /dev/null 2>&1; then
              echo "✅ firmware-info.json changed: treating as release, copying local web assets"
              cp -r "$LOCAL_ASSETS/"* docs/
            else
              echo "ℹ️ firmware-info.json unchanged (or no local): preserving published assets"
              cp "$PUBLISHED_JSON" docs/firmware-info.json
              PRESERVE_PUBLISHED=true
            fi
          elif [ -d "$LOCAL_ASSETS" ]; then
            echo "✅ Published firmware-info.json not found: copying local web assets"
            cp -r "$LOCAL_ASSETS/"* docs/
          else
            echo "⚠️ No web assets found for ${{ github.repository_owner }}"
            echo "Run the Build and Release Firmware workflow to generate them."
          fi
          if [ "$PRESERVE_PUBLISHED" = true ]; then
            mkdir -p docs/manifests
            # Pages answers 503 while a deployment is in flight, so retry, then fall back to the
            # committed manifest: an unavailable published copy must not fail the whole deploy.
            LOCAL_ASSETS="$LOCAL_ASSETS" python3 - <<'PY'
          import json, os, shutil, time, urllib.request
          base = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          local = os.environ.get("LOCAL_ASSETS", "")

          def fetch(path, dest):
              error = None
              for attempt in (1, 2, 3):
                  try:
                      urllib.request.urlretrieve(base + path, dest)
                      return None
                  except Exception as exc:
                      error = exc
                      time.sleep(2 * attempt)
              return error

          with open("docs/firmware-info.json", encoding="utf-8") as file:
              for variant in json.load(file).get("variants", []):
                  path = variant["manifest"]
                  os.makedirs(os.path.dirname(f"docs/{path}"), exist_ok=True)
                  dest = f"docs/{path}"
                  error = fetch(path, dest)
                  if error is None:
                      continue
                  fallback = os.path.join(local, path)
                  if os.path.exists(fallback):
                      shutil.copy2(fallback, dest)
                      print(f"::warning title=Manifest not refreshed::{path} unavailable ({error}), used the committed copy")
                  else:
                      print(f"::warning title=Manifest missing::{path} unavailable ({error}) and not committed")
          PY
          fi

      - name: Convert relative repo links to GitHub URLs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${DEFAULT_BRANCH}"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DEFAULT_BRANCH}"
          #
          # 1. Asset targets (images, media, archives) go to RAW urls, and must be done
          #    first: a blob url is an HTML page, so it renders as a broken image in
          #    ![alt](image.png) or ![alt](./dir/pic.png), whereas a raw url is the
          #    image bytes themselves.  The rewritten urls contain a colon, so the
          #    repo-file rewrite below leaves them alone.
          #    NOTE: '%' is the s delimiter here, not '|', because the pattern below
          #    uses '|' for alternation.  A leading './' is dropped so the raw url is
          #    repo-root relative.
          sed -i -E "s%]\((\./)?([^)#:/][^)#:]*\.(png|jpe?g|gif|webp|avif|svg|ico|bmp|mp4|webm|pdf|zip|apk))\)%](${RAW}/\2)%gI" docs/index.md
          #
          # 2. Any other repo-relative target stays relative when it resolves to a file
          #    inside docs/: that is a page MkDocs builds (or an asset it serves), and
          #    MkDocs rewrites it to the site url, so the link remains inside the site.
          #    A repo file the site does not serve, such as [LICENSE](LICENSE), becomes a
          #    blob url so it does not 404.  The test is file existence, not a page list,
          #    so a newly linked page needs no edit here, and a link to a page that does
          #    not exist fails 'mkdocs build --strict' instead of silently becoming
          #    repository view.  Targets containing ':' (https:, mailto:), starting with
          #    '#' or starting with '/' (site-absolute) are left untouched.  Nothing is
          #    hardcoded, so forks rewrite against their own repo + branch.
          BASE="${BASE}" python3 - <<'PY'
          import os
          import re

          base = os.environ["BASE"]
          link = re.compile(r"\]\(([^)\s]+)([^)]*)\)")

          def rewrite(match):
              target = match.group(1)
              if ":" in target or target.startswith(("#", "/")):
                  return match.group(0)
              clean = target[2:] if target.startswith("./") else target
              if os.path.exists(os.path.join("docs", clean.split("#")[0])):
                  return match.group(0)
              return f"]({base}/{clean}{match.group(2)})"

          with open("docs/index.md", encoding="utf-8") as fh:
              text = fh.read()
          with open("docs/index.md", "w", encoding="utf-8") as fh:
              fh.write(link.sub(rewrite, text))
          PY
          echo "Asset links rewritten against ${RAW}/"
          echo "Site-served links left relative; repo file links rewritten against ${BASE}/"

      - name: Customize firmware.html and flasher.html
        if: github.repository_owner != 'trip5'
        run: |
          # One loop, both pages: they share the constants and the marker described above.
          for page in docs/firmware.html docs/flasher.html; do
            if [ -f "$page" ]; then
              sed -i "s|const GITHUB_OWNER = '.*'|const GITHUB_OWNER = '${{ github.repository_owner }}'|g" "$page"
              sed -i "s|const REPO_NAME = '.*'|const REPO_NAME = '${{ github.event.repository.name }}'|g" "$page"
              sed -i "s|github.com/trip5/ehRadio/releases|github.com/${{ github.repository }}/releases|g" "$page"
              sed -i "s|<!-- <p>Forked by XYZ from</p> -->|<p>Forked by ${{ github.repository_owner }} from</p>|g" "$page"
              echo "✅ Customized $page for ${{ github.repository_owner }}"
            fi
          done

      - name: Download latest release firmware (.bin files)
        run: |
          mkdir -p docs/firmware
          gh release download --repo ${{ github.repository }} --pattern '*.bin' --dir docs/firmware || echo "⚠️ No release binaries found to download."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - Show docs structure before build
        run: |
          echo "📂 Docs folder structure:"
          find docs -type f | sort
          echo ""
          echo "📊 File counts:"
          echo "  Manifests: $(find docs/manifests -name '*.json' 2>/dev/null | wc -l)"
          echo "  Firmware binaries: $(find docs/firmware -name '*.bin' 2>/dev/null | wc -l)"
          echo "  HTML files: $(find docs -name '*.html' | wc -l)"

      - name: Build documentation
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-deploy
    # always() is required, not cosmetic: a skipped firmware-gate makes the implicit success()
    # false here even when build-deploy passed, which silently skipped this job on 2026-11-23.
    if: always() && needs.build-deploy.result == 'success'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
