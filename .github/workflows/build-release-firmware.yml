name: Build and Release Firmware

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2026.03.22)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required config files
        run: |
          MISSING_FILES=""
          if [ ! -f "builds/${{ github.repository_owner }}/platformio.ini" ]; then
            MISSING_FILES="${MISSING_FILES}platformio.ini "
          fi
          if [ ! -f "builds/${{ github.repository_owner }}/myoptions.h" ]; then
            MISSING_FILES="${MISSING_FILES}myoptions.h "
          fi
          if [ ! -f "builds/${{ github.repository_owner }}/releases.md" ]; then
            MISSING_FILES="${MISSING_FILES}releases.md "
          fi
          if [ ! -f "builds/${{ github.repository_owner }}/firmware.txt" ]; then
            MISSING_FILES="${MISSING_FILES}firmware.txt "
          fi
          
          if [ -n "$MISSING_FILES" ]; then
            echo "❌ Error: Missing required files in builds/${{ github.repository_owner }}/"
            echo "Missing: $MISSING_FILES"
            echo ""
            echo "Required files:"
            echo "  - platformio.ini (build configuration)"
            echo "  - myoptions.h (hardware pin definitions)"
            echo "  - releases.md (release description, generated by fix_web_assets_and_releases.md.py)"
            echo "  - firmware.txt (firmware list, generated by fix_web_assets_and_releases.md.py)"
            echo ""
            echo "To generate releases.md and firmware.txt:"
            echo "  cd builds/${{ github.repository_owner }}"
            echo "  python3 fix_web_assets_and_releases.md.py"
            echo "  git add releases.md firmware.txt web_assets/"
            echo "  git commit -m 'Update release files'"
            exit 1
          fi
          echo "✅ All required contributor config files found for ${{ github.repository_owner }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify firmware.txt and releases.md are up-to-date
        run: |
          echo "🔍 Verifying firmware.txt and releases.md are up-to-date..."
          
          # Create temp directory with same structure
          mkdir -p "temp_verify/builds/${{ github.repository_owner }}"
          
          # Copy necessary files to temp
          cp "builds/${{ github.repository_owner }}/myoptions.h" "temp_verify/builds/${{ github.repository_owner }}/"
          cp "builds/${{ github.repository_owner }}/releases.md" "temp_verify/builds/${{ github.repository_owner }}/"
          cp "builds/${{ github.repository_owner }}/fix_web_assets_and_releases.md.py" "temp_verify/builds/${{ github.repository_owner }}/"
          
          # Copy src/core/options.h for version extraction
          mkdir -p "temp_verify/src/core"
          cp "src/core/options.h" "temp_verify/src/core/"
          
          # Run script in temp directory
          cd "temp_verify/builds/${{ github.repository_owner }}"
          python3 fix_web_assets_and_releases.md.py
          cd ../../..
          
          # Compare firmware.txt
          echo "Comparing firmware.txt..."
          if ! diff -q "builds/${{ github.repository_owner }}/firmware.txt" "temp_verify/builds/${{ github.repository_owner }}/firmware.txt" > /dev/null; then
            echo ""
            echo "❌ ERROR: firmware.txt is out of date!"
            echo ""
            echo "Expected content (from myoptions.h):"
            cat "temp_verify/builds/${{ github.repository_owner }}/firmware.txt"
            echo ""
            echo "Current content (in repository):"
            cat "builds/${{ github.repository_owner }}/firmware.txt"
            echo ""
            echo "Please run fix_web_assets_and_releases.md.py locally and commit the updated firmware.txt"
            rm -rf temp_verify
            exit 1
          fi
          
          # Compare releases.md
          echo "Comparing releases.md..."
          if ! diff -q "builds/${{ github.repository_owner }}/releases.md" "temp_verify/builds/${{ github.repository_owner }}/releases.md" > /dev/null; then
            echo ""
            echo "❌ ERROR: releases.md is out of date!"
            echo ""
            echo "Expected content (from myoptions.h):"
            cat "temp_verify/builds/${{ github.repository_owner }}/releases.md"
            echo ""
            echo "Current content (in repository):"
            cat "builds/${{ github.repository_owner }}/releases.md"
            echo ""
            echo "Please run fix_web_assets_and_releases.md.py locally and commit the updated releases.md"
            rm -rf temp_verify
            exit 1
          fi

          # Compare generated web_assets (manifests + firmware-info.json)
          echo "Comparing web_assets..."
          if ! diff -qr "builds/${{ github.repository_owner }}/web_assets" "temp_verify/builds/${{ github.repository_owner }}/web_assets" > /tmp/web_assets_diff.txt; then
            echo ""
            echo "❌ ERROR: web_assets is out of date!"
            echo ""
            cat /tmp/web_assets_diff.txt
            echo ""
            echo "Please run fix_web_assets_and_releases.md.py locally and commit updated web_assets/"
            rm -rf temp_verify
            exit 1
          fi
          
          # Clean up temp directory
          rm -rf temp_verify
          
          echo "✅ firmware.txt, releases.md, and web_assets are up-to-date"

      - name: Load release body text
        id: release_body
        run: |
          echo "Using release body from builds/${{ github.repository_owner }}/releases.md"
          # Read the file and set as multiline output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat "builds/${{ github.repository_owner }}/releases.md" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Copy config files to project root
        run: |
          if [ -d "builds/${{ github.repository_owner }}" ]; then
            cp -rf builds/${{ github.repository_owner }}/* .
          fi

      - name: Prepare Gzipped Web Assets for Release
        run: |
          mkdir -p www_release
          for file in data/www/*; do
            filename=$(basename "$file")
            if [[ "$filename" == *.gz ]]; then
              echo "Copying $filename without compression (already gzipped)."
              cp "$file" "www_release/"
            elif [[ "$filename" == "rb_srvrs.json" ]]; then
              cp "$file" "www_release/"
              echo "Adding $filename without compression."
            else
              echo "Compressing $filename."
              gzip -c -9 "$file" > "www_release/$filename.gz"
            fi
          done

      - name: Prepare Gzipped Locale Files for Release
        run: |
          mkdir -p locale_release
          for file in src/locale/webui/*.json; do
            filename=$(basename "$file")
            echo "Compressing $filename."
            gzip -c -9 "$file" > "locale_release/$filename.gz"
          done

      - name: Get version tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="${VERSION}"
            echo "Using manual dispatch version: ${VERSION}"
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG}
            echo "Using git tag: ${TAG}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Final version: ${VERSION}"
          grep '#define RADIOVERSION ' src/core/options.h > version.txt

      - name: Validate version matches options.h
        run: |
          EXPECTED_VERSION="${{ steps.get_version.outputs.version }}"
          ACTUAL_VERSION=$(grep -oP '#define RADIOVERSION "\K[^"]+' src/core/options.h)
          
          echo "Expected version (tag/input): ${EXPECTED_VERSION}"
          echo "Actual version (options.h):   ${ACTUAL_VERSION}"
          
          if [ "${EXPECTED_VERSION}" != "${ACTUAL_VERSION}" ]; then
            echo ""
            echo "❌ ERROR: Version mismatch!"
            echo "The tag/input version '${EXPECTED_VERSION}' does not match the version in src/core/options.h '${ACTUAL_VERSION}'"
            echo ""
            echo "Please update RADIOVERSION in src/core/options.h to match your tag:"
            echo "  #define RADIOVERSION \"${EXPECTED_VERSION}\""
            echo ""
            exit 1
          fi
          
          echo "✅ Version validation passed"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Make binaries folder to stash .bin files
        run: mkdir -p binaries

      - name: Build all firmwares
        run: pio run

      - name: Rename firmware files with env name
        run: |
          for d in .pio/build/*/ ; do
            env=$(basename "$d")
            if [ -f "$d/firmware.bin" ]; then
              cp "$d/firmware.bin" "binaries/${env}.bin"
            fi
          done

      - name: Save bootloader/partitions for each board environment
        run: |
          # Extract all environments prefixed with 'board' from platformio.ini
          board_envs=$(grep -oP '(?<=\[env:board_)[^\]]+' platformio.ini | tr '\n' ' ')
          echo "Board environments: $board_envs"

          # Iterate over all board environments
          for env in $board_envs; do
            echo "Processing environment: $env"

            # Copy and rename bootloader and partitions binaries
            cp .pio/build/board_$env/bootloader.bin binaries/board_${env}_bootloader.bin
            cp .pio/build/board_$env/partitions.bin binaries/board_${env}_partitions.bin
          done

      - name: Build SPIFFS and extract for each board environment
        run: |
          # Extract all environments prefixed with 'board' from platformio.ini
          board_envs=$(grep -oP '(?<=\[env:board_)[^\]]+' platformio.ini | tr '\n' ' ')
          echo "Board environments: $board_envs"

          # Iterate over all board environments
          for env in $board_envs; do
            echo "Processing environment: $env"

            # Build SPIFFS
            pio run --environment board_$env --target buildfs

            # Copy and rename SPIFFS binaries
            cp .pio/build/board_$env/spiffs.bin binaries/board_${env}_spiffs.bin

          done

      - name: Organize firmware for ESP Web Tools
        run: |
          echo "📦 Organizing firmware for ESP Web Tools manifests..."
          mkdir -p firmware
          
          # Extract unique board environments and copy bootloader/partitions
          BOARD_ENVS=$(awk -F'|' '{print $1}' firmware.txt | sort -u)
          for board_env in $BOARD_ENVS; do
            echo "📋 Copying shared files for $board_env..."
            mkdir -p "firmware/$board_env"
            cp "binaries/${board_env}_bootloader.bin" "firmware/$board_env/bootloader.bin"
            cp "binaries/${board_env}_partitions.bin" "firmware/$board_env/partitions.bin"
            echo "✅ $board_env: bootloader + partitions"
          done
          
          # Copy individual firmware binaries
          while IFS='|' read -r board_env chip_family fw_env friendly_name; do
            echo "📦 Copying firmware: $fw_env"
            mkdir -p "firmware/$fw_env"
            if [ -f "binaries/${fw_env}.bin" ]; then
              cp "binaries/${fw_env}.bin" "firmware/$fw_env/firmware.bin"
              echo "✅ $fw_env: firmware.bin"
            else
              echo "❌ Warning: firmware.bin not found for $fw_env"
            fi
          done < firmware.txt
          
          echo "📦 Firmware organization complete"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            binaries/*.bin
            firmware/**/*.bin
            www_release/*
            locale_release/*
            builds/${{ github.repository_owner }}/web_assets/**
          retention-days: 90

      - name: Create ehRadio Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "${{ steps.get_version.outputs.tag }}"
          body: ${{ steps.release_body.outputs.body }}
          files: |
            binaries/*.bin
            www_release/*
            locale_release/*
            version.txt
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases and assets
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
