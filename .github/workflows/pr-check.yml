name: PR Check

on:
  pull_request:
    branches:
      - dev
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:

  # -------------------------------------------------------------------------
  # Job 1: Branch guard
  # Blocks PRs targeting 'main' from anyone other than the repo owner.
  # The 'main' branch is kept in sync with 'dev' by the owner only.
  # -------------------------------------------------------------------------
  branch-guard:
    name: Branch check
    runs-on: ubuntu-latest
    steps:
      - name: Block PRs to main from non-owner
        if: github.base_ref == 'main' && github.actor != github.repository_owner
        run: |
          echo "❌ Pull requests to the 'main' branch are not accepted."
          echo ""
          echo "Please retarget your PR to the 'dev' branch instead."
          echo "The 'main' branch is a release sync managed by the repo owner."
          exit 1
      - name: OK
        run: echo "✅ Branch check passed."



  # -------------------------------------------------------------------------
  # Job 2: Static analysis via cppcheck + ReviewDog
  # Runs only for PRs targeting 'dev'.
  # Posts inline review comments on changed lines only (filter_mode: added).
  # -------------------------------------------------------------------------
  cppcheck:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    needs: branch-guard
    if: github.base_ref == 'dev'
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck and reviewdog
        run: |
          sudo apt-get install -y cppcheck
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh \
            | sh -s -- -b /usr/local/bin
# Current version (note in case we need to pin the version): sh -s -- -b /usr/local/bin v0.20.2

      - name: Run cppcheck via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cppcheck \
            --enable=warning,style,performance \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=syntaxError \
            --inline-suppr \
            --language=c++ \
            --std=c++17 \
            -I src -I src/core -I src/displays \
            --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
            src/core src/displays/widgets src/main.cpp \
            2>&1 | reviewdog \
              -efm="%f:%l:%c: %t%*[^:]: %m %*[^ ]" \
              -name="cppcheck" \
              -reporter=github-pr-review \
              -filter-mode=added \
              -fail-level=any

  # -------------------------------------------------------------------------
  # Job 3: Config check
  # Runs the fast half of prepare_releases.py for PRs to 'dev' and 'main':
  #   - FIRMWARE must be '<contributor folder>_<env>.bin' for an [env:...] declared in
  #     that folder's platformio.ini, or the release pipeline never picks the binary up
  #   - the contributor field must prefix the filename, or credit and asset name drift
  #   - board_build.filesystem must be littlefs, or the image can never mount
  #   - every contributor myoptions.h must be preprocessor-balanced: a stray #endif closes
  #     the include guard early, and options_overrides.h includes that file in every
  #     translation unit, so a single orphan line fails the entire build
  # No compiler runs and nothing is written.
  # -------------------------------------------------------------------------
  config-check:
    name: Config check
    runs-on: ubuntu-latest
    needs: branch-guard
    if: github.base_ref == 'dev' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate contributor configs
        run: python3 builds/prepare_releases.py --check

  # -------------------------------------------------------------------------
  # Job 4: Compile firmware (test builds)
  # Runs only for PRs targeting 'dev'.
  # -------------------------------------------------------------------------
  compile:
    name: Compile firmware (test builds)
    runs-on: ubuntu-latest
    needs: branch-guard
    if: github.base_ref == 'dev'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('builds/test/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Copy test config files
        run: |
          cp builds/test/platformio.ini platformio.ini
          cp builds/test/myoptions.h myoptions.h

      - name: Build test environments
        run: pio run

  # -------------------------------------------------------------------------
  # Job 5: Build every contributor firmware
  # Runs only for PRs targeting 'main', the owner's release sync. This is the full set the
  # release workflow builds, produced by the same script used locally, so a folder that no
  # longer compiles cannot reach main. The light 'compile' job above stays for contributor
  # PRs against dev.
  #
  # This job covers the release metadata too: prepare_releases.py regenerates
  # builds/releases/ only after every environment has built, so a non-empty git status here
  # means the metadata is stale. git status rather than git diff, because a new
  # contributor's manifest is untracked and untracked files never appear in a diff.
  #
  # NO PR JOB MAY PASS --no-build. That flag exists for the two release workflows, whose
  # next step compiles the same environments. Here it would make the gate cosmetic.
  # -------------------------------------------------------------------------
  build-all:
    name: Build all firmware
    runs-on: ubuntu-latest
    needs: branch-guard
    if: github.base_ref == 'main'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-all-${{ runner.os }}-${{ hashFiles('builds/trip5/platformio.ini', 'builds/prepare_releases.py') }}
          restore-keys: |
            pio-all-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build every contributor firmware
        run: python3 builds/prepare_releases.py --yes

      - name: Check builds/releases is committed
        run: |
          if [ -n "$(git status --porcelain -- builds/releases/)" ]; then
            echo "❌ builds/releases/ is out of date:"
            git status --short -- builds/releases/
            git --no-pager diff -- builds/releases/ | head -200
            echo ""
            echo "Regenerate locally and commit the result:"
            echo "  python builds/prepare_releases.py"
            echo "  git add builds/releases/"
            exit 1
          fi
          echo "✅ builds/releases/ matches builds/*/myoptions.h"
