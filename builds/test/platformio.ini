[platformio]
src_dir = ./src
data_dir = ./data

; -----------------------------------------------------------------------
; CI test build configuration.
; Copied to the repo root by .github/workflows/pr-check.yml before build.
; -----------------------------------------------------------------------

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_MODE=1
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
  adafruit/Adafruit GFX Library@^1.12.5
  adafruit/Adafruit BusIO@^1.17.4
  ESP32Async/ESPAsyncWebServer@^3.10.1
  ESP32Async/AsyncTCP@^3.4.10
  marvinroger/AsyncMqttClient@^0.9.0
  trip5/ESPFileUpdater@^1.2.0
  trip5/ehDP@^1.0.0
  jnthas/Improv WiFi Library@^0.0.4
build_src_filter =
  -<*>
  +<../myoptions.h>
  +<../mytheme.h>
  +<main.cpp>
  +<locale/*>
  +<core/*>
  +<displays/fonts/*>
  +<displays/tools/*>
  +<displays/widgets/*>
  +<plugins/*>
  +<pluginsManager/*>
  +<displays/dispcore.h>

; Only the localize script is needed for a compile check.
; The www gzip scripts compress SPIFFS data files and are not needed here.
extra_scripts = pre:builds/platformio_pre_localize.py

; -----------------------------------------------------------------------
; Base board: ESP32-S3-DevKitC-1 (16MB flash, OPI PSRAM)
; Matches the hardware used by trip5 and kasperaitis builds.
; -----------------------------------------------------------------------
[env:board_esp32_s3_n16r8]
extends = env
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
board_build.extra_flags =
  -DBOARD_ESP32_S3_N16R8
lib_deps =
  ${env.lib_deps}
build_src_filter =
  ${env.build_src_filter}
  +<libraries/I2S_Audio/*>

; -----------------------------------------------------------------------
; TEST BUILD 1: I2S PCM + ILI9488
; Exercises: I2S_Audio, core, color display, SD Card, Rotary, Button, RGB LED
; -----------------------------------------------------------------------
[env:test_ci_pcm]
extends = env:board_esp32_s3_n16r8
build_flags =
  ${env:board_esp32_s3_n16r8.build_flags}
board_build.extra_flags =
  -DTEST_CI_PCM
lib_deps =
  ${env:board_esp32_s3_n16r8.lib_deps}
  mathertel/OneButton@^2.6.2
  igorantolic/Ai Esp32 Rotary Encoder@^1.7
  adafruit/Adafruit NeoPixel@^1.15.4 ; LED control
build_src_filter =
  ${env.build_src_filter}
  +<libraries/I2S_Audio/*>
  +<displays/conf/displayILI9488*>
  +<displays/displayILI9488*>
  +<libraries/ILI9488/*>

; -----------------------------------------------------------------------
; TEST BUILD 2: VS1053 hardware decoder + SH1106 OLED
; Exercises: VS1053_Audio, core, mono display, MQTT, Battery
; -----------------------------------------------------------------------
[env:test_ci_vs1053]
extends = env:board_esp32_s3_n16r8
build_flags =
  ${env:board_esp32_s3_n16r8.build_flags}
board_build.extra_flags =
  -DTEST_CI_VS1053
lib_deps =
  ${env:board_esp32_s3_n16r8.lib_deps}
  adafruit/Adafruit ILI9341@^1.6.2
build_src_filter =
  ${env.build_src_filter}
  +<libraries/VS1053_Audio/*>
  +<displays/conf/displayILI9341*>
  +<displays/displayILI9341*>
