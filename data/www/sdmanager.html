<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#eecccc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" id="themeCSS" href="theme.css" type="text/css">
  <link rel="stylesheet" id="styleCSS" href="style.css" type="text/css">
  <title>ehRadio - SD File Manager</title>
</head>
<body class="sdman">

<div id="pleditorwrap">
  <div id="pleditor">
    <h2><span data-i18n="ttl_sd_file_manager">SD File Manager</span></h2>

    <div id="sdmaninfo" class="pleditorwarning hidden"></div>
    <div id="sdmanpath" class="sdpath"></div>

    <div id="pleheader">
      <span class="sdico"></span>
      <span class="space sdcheck"><input type="checkbox" id="selectAllCheckbox"></span>
      <span class="sdname sdsort" id="sdmanSortName" data-i18n="lbl_name">Name</span>
      <span class="sdsize sdsort" id="sdmanSortSize" data-i18n="lbl_size">Size</span>
      <span class="sdload"></span>
    </div>

    <ol id="pleditorcontent"></ol>

    <div class="formbuttons">
      <div class="fb" id="sdmanNewDir" data-i18n="btn_new_folder">New folder</div>
      <!-- Two upload buttons.  Replace writes over a name that is already there, Skip Existing leaves it
           alone and says so.  The mode rides on the input as data-skip, because both share one handler. -->
      <label class="fb" id="sdmanUploadLbl" for="sdmanupload" data-i18n="btn_upload_replace">Upload (Replace)</label>
      <input id="sdmanupload" type="file" multiple hidden data-skip="0">
      <label class="fb" id="sdmanUploadSkipLbl" for="sdmanuploadskip" data-i18n="btn_upload_skip">Upload (Skip Existing)</label>
      <input id="sdmanuploadskip" type="file" multiple hidden data-skip="1">
      <div class="fb" id="sdmanDelete" data-i18n="btn_delete">Delete</div>
      <div class="fb" id="sdmanDone" data-i18n="btn_done">Done</div>
    </div>
  </div>
</div>

<div id="progress" class="hidden">
  <span id="loader"></span>
  <!-- Three lines, stacked by the stylesheet: headline, file, percentage.  Short operations only fill the first. -->
  <div id="progresstext">
    <div id="progresslabel"></div>
    <div id="progressfile"></div>
    <div id="progresspct"></div>
  </div>
</div>

<script src="locale.js"></script>
<script>
// SD card file manager. Every /sdman/* route is on the device; the sorting happens here, because the device streams
// a directory once and does not sort it. The page keeps its own address for the session - the device redirects "/"
// here while the mode is open - and is reachable in AP mode too, where the card is simply portable storage.
// Never route t() through a wrapper, and never write the literal two-argument call in a comment: src/locale/www_tool.py
// scans for that form, so a wrapper hides every string from it and prose in a comment invents a bogus key.
(function () {
  'use strict';

  var state = { path: '/', entries: [], sortKey: 'n', sortDir: 1, armed: false, arming: false, card: '', locked: false, uploading: false, busy: false,
                notice: { text: '', error: false, sticky: false } };
  // True for the WHOLE of an upload batch, not per file: state.uploading is cleared between files, and both the idle
  // redirect and keepAlive() must hold across that gap too.
  state.batch = false;

  // The rename glyph is a filled drawing, so it follows the project's .fill convention rather than .stroke.
  var SVG_RENAME = '<svg viewBox="0 0 20 20" class="fill"><path d="M17,20H1c-0.6,0-1-0.4-1-1V3c0-0.6,0.4-1,1-1h9v2H2v14h14v-8h2v9C18,19.6,17.6,20,17,20z"/><path d="M9.3,10.7c-0.4-0.4-0.4-1,0-1.4l9-9c0.4-0.4,1-0.4,1.4,0s0.4,1,0,1.4l-9,9C10.3,11.1,9.7,11.1,9.3,10.7z"/></svg>';
  var SVG_LOAD   = '<svg viewBox="0 0 24 24" class="stroke"><path d="m19 14-7 7-7-7m7 7V3"/></svg>';
  var SVG_UP     = '<svg viewBox="0 0 24 24" class="stroke"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>';

  function $(id) { return document.getElementById(id); }
  function enc(p) { return encodeURIComponent(p); }
  function join(dir, name) { return (dir === '/' ? '' : dir) + '/' + name; }
  function parentOf(p) { var i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.substring(0, i); }

  // Entities are assembled from pieces: a literal entity in this file is rewritten by the tooling that copies it.
  var AMP = '&' + 'amp;', LT = '&' + 'lt;', GT = '&' + 'gt;', QUOT = '&' + 'quot;', APOS = '&' + '#39;';
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': AMP, '<': LT, '>': GT, '"': QUOT, "'": APOS }[c];
    });
  }

  function fmtSize(b) {
    if (!b) return '';
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (i ? b.toFixed(1) : String(b)) + ' ' + u[i];
  }

  // The overlay has two shapes because its work does: busy() is the one-line form a rename, delete or mkdir uses, and
  // busyUpload() the three-line form an upload gets. Only the percentage changes while a transfer runs.
  function busy(on, text) {
    $('progress').classList.toggle('hidden', !on);
    $('progresstext').classList.remove('upload');
    $('progresslabel').textContent = on ? (text || '') : '';
    $('progressfile').textContent = '';
    $('progresspct').textContent = '';
    _pctName = '';   // a new operation starts the upload bar's high-water mark over
    _pctHigh = -1;
    // While an operation runs the whole button row is inert and dimmed, and Delete drops its "Delete 3?" wording:
    // the count belongs to the press that armed it.
    state.busy = !!on;
    document.body.classList.toggle('busy', !!on);
    if (on) armDelete(false);
  }

  // The upload bar and its percentage only ever move FORWARD for the file they belong to: a retry resumes below the
  // high-water mark, so drawing it would walk the bar backwards and read as lost progress. The mark is keyed to the NAME.
  var _pctName = '', _pctHigh = -1;
  function busyUpload(step, name, pct) {
    $('progress').classList.remove('hidden');
    $('progresstext').classList.add('upload');
    state.busy = true;                    // an upload is the other shape of busy: the same inert button row
    document.body.classList.add('busy');
    $('progresslabel').textContent = t('msg_file_uploading', 'Uploading') + (step ? ' ' + step : '');
    $('progressfile').textContent = name || '';
    if ((name || '') !== _pctName) { _pctName = name || ''; _pctHigh = -1; }
    var n = parseInt(pct, 10);
    if (!isNaN(n) && n > _pctHigh) _pctHigh = n;   // a lower figure (a resume) is simply not drawn
    $('progresspct').textContent = (_pctHigh >= 0) ? _pctHigh + '%' : '';
  }

  // The listing has a spinner of its own inside the list, so it must not raise the full-screen overlay - but the
  // controls above it are just as inert. It is counted because the not_active path calls load() from inside load().
  var _listing = 0;
  function listing(on) {
    _listing = Math.max(0, _listing + (on ? 1 : -1));
    document.body.classList.toggle('listing', _listing > 0);
  }

  // The message slot lives in state, not in the element: a report must hold its place until another replaces it, or
  // until the user leaves the folder. No timer - a message that vanishes while it is read is the bug this fixes.
  // `html` is for our OWN composed strings only, an explicit flag rather than a guess; every caller that passes it
  // must escape anything not of our making. Everything else stays textContent, which cannot inject anything.
  function notice(msg, isError, sticky, html) {
    state.notice = { text: msg || '', error: !!isError, sticky: !!sticky, html: !!html };
    paintNotice();
  }

  /* Repaints the slot from state.  Called by everything that redraws the page, so a repaint can never lose a message. */
  function paintNotice() {
    var n = $('sdmaninfo');
    n.classList.toggle('hidden', !state.notice.text);
    if (state.notice.html) n.innerHTML = state.notice.text;
    else n.textContent = state.notice.text;
    n.style.borderColor = (state.notice.text && state.notice.error) ? '#d33' : '';
  }

  // Server error codes to something the user can act on: a switch rather than a table, so every message sits inside a
  // literal two-argument t() call - the only form the collector in src/locale/www_tool.py can see.
  function errText(code) {
    switch (code) {
      // in_use and not_connected fall through to the general failure: the first is a race against the stop entering
      // the mode performs, the second went with the AP-mode restriction. not_found, no_dir and no_parent are one
      // answer on purpose: to the user the named path is simply not on the card, so the listing is out of date.
      case 'protected':     return t('msg_item_protected', 'That item is protected and cannot be changed.');
      case 'exists':        return t('msg_file_folder_exists', 'File/folder with that name already exists.');
      case 'no_space':      return t('msg_sd_no_space', 'There is not enough space on the card.');
      case 'not_found':
      case 'no_dir':
      case 'no_parent':     return t('msg_file_folder_not_found', 'File/folder not found.');
      // There is no no_card message: the device refuses to open the mode at all, so the page has left the manager
      // before a message could be shown (see leaveManager()).
      case 'bad_name':      return t('msg_name_not_allowed', 'That name is not allowed.');
      case 'not_dir':       return t('msg_not_folder', 'That is not a folder.');
      case 'write_failed':  return t('msg_write_failed', 'The card refused a write - it may be full or faulty.');
      // The card fell behind what the writes claimed, so those bytes are gone and the file must be sent again - the
      // same advice as a refused write, told apart on the wire and in the device log.
      case 'card_lagging':  return t('msg_write_failed', 'The card refused a write - it may be full or faulty.');
      case 'cut_off':       return t('msg_upload_cut_off', 'The upload was cut off before it finished.');
      // The device refused an offset it could not vouch for, so the page's figure was stale and the whole file is
      // sent; the user sees this only if that attempt failed too.
      case 'resume_refused': return t('msg_write_failed', 'The card refused a write - it may be full or faulty.');
      case 'uploading':     return t('msg_file_upload_in_progress', 'An upload is in progress - wait for it to finish.');
      // A delete batch holds the mode too; this key falls back to the English default until the locale tooling picks it up.
      case 'busy':          return t('msg_file_delete_in_progress', 'A delete is in progress - wait for it to finish.');
      case 'not_active':    return t('msg_sd_file_manager_closed', 'SD File Manager was closed.');
      default:              return t('msg_operation_failed', 'The operation failed.');
    }
  }

  // A card that cannot be mounted ends the manager on both sides: the device refuses to open the mode at all, so
  // there is nothing left for this page to do here. Back to "/", which the device serves as the web UI.
  function leaveManager() {
    window.location.replace('/');
  }

  // Ask for the mode back after the device's idle clock closed it under the page. Resolves true when it opened, false
  // when it refused because no card could be mounted - in which case the page has already left.
  function reenterManager() {
    return fetch('/sdman/enter').then(function (r) {
      if (r.ok) return true;
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (j.error === 'no_card') leaveManager();
        return false;
      });
    }).catch(function () { return false; });
  }

  function post(url, body) {
    return fetch(url, { method: 'POST', body: body || null }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'bad_response' }; });
    });
  }

  function renderPath() {
    $('sdmanpath').textContent = state.path + (state.card ? '  \u00b7  ' + state.card : '');
  }

  // Every response carries the mode's remaining idle time, so the tab can end itself when the device does. The reload
  // is deliberately a couple of seconds late: firing at zero could arrive before the device's own timeout.
  var idleTimer = null;
  function scheduleIdleReload(ms) {
    if (idleTimer) window.clearTimeout(idleTimer);
    idleTimer = null;
    if (!ms) return;
    // The guard is checked when the timer FIRES, not only when armed: arming happens on the first /sdman/info of the
    // session, so a batch still running when it expired used to be navigated away from, aborting the upload.
    idleTimer = window.setTimeout(function () {
      idleTimer = null;
      if (state.uploading || state.batch) return;
      window.location.replace('/');
    }, ms + 2000);
  }

  // Choosing a file can take minutes in a dialog the device cannot see, so user activity is reported as it happens:
  // /sdman/info touches the device's clock and returns the remaining time to scheduleIdleReload(). A click always
  // pings; keys are throttled because they arrive in runs.
  var _lastPing = 0;
  function keepAlive(minGap) {
    if (state.uploading || state.batch) return;   // an upload's own chunks are the touch, at a far higher rate
    var now = Date.now();
    if (now - _lastPing < minGap) return;
    _lastPing = now;
    loadInfo();
  }
  document.addEventListener('click', function () { keepAlive(1000); });
  document.addEventListener('keydown', function () { keepAlive(15000); });

  function sortEntries() {
    state.entries.sort(function (a, b) {
      if (a.d !== b.d) return b.d - a.d;                       // folders always first
      var r = (state.sortKey === 's') ? (a.s - b.s)
                                      : a.n.localeCompare(b.n, undefined, { numeric: true, sensitivity: 'base' });
      return r * state.sortDir;
    });
  }

  function selection() {
    var out = [], boxes = document.querySelectorAll('#pleditorcontent input.sdcheck:checked');
    for (var i = 0; i < boxes.length; i++) out.push(boxes[i].value);
    return out;
  }

  // The Delete button is a two-step control: the first press only arms it and says so, and presses within the next
  // second are ignored, so a double-tap cannot delete anything by accident.
  function armDelete(armed) {
    state.armed = armed;
    var d = $('sdmanDelete'), n = selection().length;
    d.removeAttribute('data-i18n');
    // The count belongs to the confirmation step; the first press says only Delete and does nothing yet.
    d.textContent = (armed && n) ? t('btn_delete_n', 'Delete {0}?', n) : t('btn_delete', 'Delete');
    d.classList.toggle('off', state.locked || !n);
  }

  // The whole directory is rendered at once and the list scrolls: there is no paging anywhere, not on the device
  // (which streams every entry in one response) and not here, so select-all means the whole folder.
  function render() {
    renderPath();

    // The data folder holds the derived playlist, the SD index and the credentials, and the device refuses every
    // change inside it, so the controls are dimmed here while browsing in stays allowed. The name must match
    // SD_DATA_DIR; /data is NOT locked (the old name), and the user may delete it. UX only - the DEVICE is the guard.
    var locked = (state.path === '/ehradio.data' || state.path.indexOf('/ehradio.data/') === 0);
    state.locked = locked;
    // Uploads are dimmed only where the folder itself is protected; New Folder and Delete keep working.
    var noUpload = locked;

    var html = '';
    if (state.path !== '/') {
      // The tip is built with t() as the row is drawn, exactly like the rename and download tips. The row carries no
      // data-i18n: inside a concatenation the collector's "up to the next '>'" rule recorded a fragment as the string.
      html += '<li class="pleitem sdup" data-up="' + esc(parentOf(state.path)) + '">'
            + '<span class="sdico"><span class="sdiconbtn" title="'
            + esc(t('ttl_up', 'Up one level')) + '">' + SVG_UP + '</span></span>'
            + '<span class="sdcheck"></span>'
            + '<span class="sdname">..</span><span class="sdsize"></span><span class="sdload"></span></li>';
    }

    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      var full = join(state.path, e.n);
      // Every control carries the name or path it acts on as its title, so which row a control belongs to is
      // checkable on hover. The rename and download tips are built with t() as the rows are rendered.
      var renameCell = locked
        ? '<span class="sdiconbtn off">' + SVG_RENAME + '</span>'
        : '<span class="sdiconbtn" data-act="rename" title="'
          + esc(t('ttl_rename', 'Rename {0}', e.n)) + '">' + SVG_RENAME + '</span>';
      html += '<li class="pleitem' + (e.d ? ' dir' : '') + '" data-p="' + esc(full) + '">'
            + '<span class="sdico">' + renameCell + '</span>'
            + '<span class="sdcheck"><input type="checkbox" class="sdcheck" value="' + esc(full)
            + '" title="' + esc(full) + '"' + (locked ? ' disabled' : '') + '></span>'
            + '<span class="sdname" title="' + esc(full) + '">' + esc(e.n) + '</span>'
            + '<span class="sdsize">' + (e.d ? '' : fmtSize(e.s)) + '</span>'
            + '<span class="sdload">' + (e.d ? '' : '<a class="sdiconbtn" href="/sdman/download?path='
            + enc(full) + '" download title="' + esc(t('ttl_download', 'Download {0}', e.n)) + '">'
            + SVG_LOAD + '</a>') + '</span>'
            + '</li>';
    }
    // Folders are rendered in full, so an empty one really is empty and the notice applies at any depth.
    if (!state.entries.length) {
      html += '<li class="pleitem sdnotice">' + esc(t('msg_folder_empty', 'This folder is empty')) + '</li>';
    }
    $('pleditorcontent').innerHTML = html;

    $('sdmanNewDir').classList.toggle('off', locked);
    $('sdmanUploadLbl').classList.toggle('off', noUpload);
    $('sdmanUploadSkipLbl').classList.toggle('off', noUpload);
    $('selectAllCheckbox').checked = false;
    $('selectAllCheckbox').disabled = locked;
    armDelete(false);
    // The banner is derived from the state rather than an event, and is flagged as an error so it wears the same red
    // border as a failure. An event message already in the slot is left alone.
    if (locked) notice(t('msg_folder_protected', 'This folder is protected.'), true, true);
    else if (state.notice.sticky) notice('');
    else paintNotice();
  }

  function load(path, keepScroll, retried, busyTries) {
    var box = $('pleditorcontent');
    var wasScroll = keepScroll ? box.scrollTop : 0;
    box.innerHTML = '<li class="pleitem sdnotice"><span class="plloader"><span class="loader"></span></span></li>';
    // The row is inert while the folder is walked, and `release` drops that on every way out: the success path, the
    // returns, the catch and the not_active retry. Disarmed here too, because the selection is about to be replaced.
    listing(true);
    armDelete(false);
    function release() { listing(false); }

    return fetch('/sdman/list?path=' + enc(path)).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'bad_response' }; });
    }).then(function (j) {
      // The mode times out after SDMAN_AUTO_EXIT_MS with no requests; a tab still open means the user is here, so ask
      // for the mode back once and carry on rather than showing an error. A card-less device refuses that, and
      // reenterManager() has already taken the page back to "/".
      if (!j.ok && j.error === 'not_active' && !retried) {
        return reenterManager().then(function (opened) { if (opened) return load(path, keepScroll, true); });
      }
      // A listing is refused while another is in flight or while an upload is writing: the device asking the page to
      // come back, not a failure, so it retries quietly. That is what makes a second tab harmless.
      if (!j.ok && (j.error === 'busy' || j.error === 'uploading') && (busyTries || 0) < 4) {
        window.setTimeout(function () { load(path, keepScroll, retried, (busyTries || 0) + 1); }, 1200);
        return;
      }
      if (!j.ok) {
        // No card: the manager cannot exist, so the page leaves instead of reporting a failure it cannot fix.
        if (j.error === 'no_card') { leaveManager(); return; }
        notice(errText(j.error), true);
        box.innerHTML = '';
        return;
      }
      state.path = j.path || path;
      state.entries = j.entries || [];
      scheduleIdleReload(j.idle);
      sortEntries();
      render();
      box.scrollTop = wasScroll;
    }).catch(function () {
      notice(errText('bad_response'), true);
      box.innerHTML = '';
    }).then(release, release);
  }

  function loadInfo() {
    return fetch('/sdman/info').then(function (r) { return r.json(); }).then(function (j) {
      // This is the page's only poll (a click, a keystroke), so it is also where a card pulled from the slot is
      // noticed: the device has closed the mode by then and answers no_card.
      if (!j.ok) { if (j.error === 'no_card') leaveManager(); return; }
      // The mode is open but the card is not mounted: the manager has nothing to show, so leave the same way.
      if (!j.mounted) { leaveManager(); return; }
      scheduleIdleReload(j.idle);
      state.card = t('msg_sd_used', 'Used {0} of {1}', fmtSize(j.used), fmtSize(j.total));
      // The allocation unit is still carried for reference, though nothing on the page acts on it now.
      var au = j.au || 0;
      if (au !== state.au) state.au = au;
      renderPath();
    }).catch(function () {});
  }

  function mutate(url, okMsg) {
    busy(true, t('msg_working', 'Working...'));
    return post(url).then(function (j) {
      busy(false);
      notice(j.ok ? (okMsg || '') : errText(j.error), !j.ok);
      if (j.ok) return load(state.path, true);
    });
  }

  function doRename(full) {
    var base = full.substring(full.lastIndexOf('/') + 1);
    var nn = window.prompt(t('msg_new_name', 'New name'), base);
    if (nn === null) return;
    nn = nn.trim();
    if (!nn || nn === base) return;
    mutate('/sdman/rename?from=' + enc(full) + '&to=' + enc(nn));
  }

  function doDelete() {
    var paths = selection();
    if (!paths.length) return;
    busy(true, t('msg_deleting', 'Deleting...'));
    // One request for the whole selection, so a multi-delete costs one walk of the card and one reload.
    post('/sdman/delete', paths.join('\n')).then(function (j) {
      busy(false);
      // One count, one message. refused is read as well as failed, so a selection the device refused outright -
      // nothing deleted, ok still false - is reported too.
      var gone = (j.failed || 0) + (j.refused || 0);
      notice(gone ? t('msg_delete_failed', '{0} could not be deleted.', gone) : '', gone > 0);
      return load(state.path, true);
    });
  }

  /* ---- events ------------------------------------------------------------------------------------- */

  // Browsing is the deliberate action that clears a message: leaving the folder changes the context, while ticking a
  // box or re-sorting leaves a message in place to be read.
  $('pleditorcontent').addEventListener('click', function (ev) {
    var li = ev.target.closest('li.pleitem');
    if (!li) return;
    if (li.dataset.up) { notice(''); load(li.dataset.up); return; }
    if (ev.target.closest('[data-act="rename"]')) { doRename(li.dataset.p); return; }
    if (ev.target.closest('a')) return;                     // the download link does its own thing
    if (ev.target.closest('input')) return;                 // the checkbox does its own thing
    if (li.classList.contains('dir')) { notice(''); load(li.dataset.p); }   // tapping a folder opens it
  });

  $('pleditorcontent').addEventListener('change', function (ev) {
    if (ev.target.classList.contains('sdcheck')) armDelete(false);
  });

  /* Select-all covers every row in the folder, because every row is rendered. */
  $('selectAllCheckbox').onchange = function () {
    var boxes = document.querySelectorAll('#pleditorcontent li.pleitem:not(.sdup) input.sdcheck');
    for (var i = 0; i < boxes.length; i++) boxes[i].checked = this.checked;
    armDelete(false);
  };

  // Every button under the list clears the message first, so the answer to the action about to be taken is never
  // beside the answer to the last one. Capture phase on purpose: the clear must run before the button's own handler.
  $('pleditorwrap').querySelector('.formbuttons').addEventListener('click', function () { notice(''); }, true);

  $('sdmanDelete').onclick = function () {
    if (state.locked || !selection().length) return;
    if (!state.armed) {
      armDelete(true);
      state.arming = true;
      window.setTimeout(function () { state.arming = false; }, 1000);
      return;
    }
    if (state.arming) return;
    doDelete();
  };

  $('sdmanNewDir').onclick = function () {
    if (state.locked) return;
    var nn = window.prompt(t('msg_new_folder_name', 'New folder name'), '');
    if (nn === null) return;
    nn = nn.trim();
    if (!nn) return;
    mutate('/sdman/mkdir?path=' + enc(join(state.path, nn)));
  };

  // Uploads go one file per request, as multipart: one request per file keeps the device's upload handler
  // unambiguous about where a file starts, and XHR is what can report progress on the way up.
  // Both upload buttons run this. Replace leaves the device's default alone - the target is opened for writing, which
  // truncates, so an existing name is overwritten. Skip Existing asks for skip=1, and the device leaves it untouched.
  // How long one file may make no progress before the page gives up and moves on; the device's own deadline is longer.
  var UPLOAD_STALL_MS = 20000;

  function startUpload(input) {
    if (state.locked) return;
    var chosen = input.files;
    if (!chosen || !chosen.length) return;
    // Snapshot the selection BEFORE clearing the input: Chromium hands back the same live FileList and
    // input.value = '' empties it in place, so a loop reading it found nothing and sent no request at all.
    var files = [];
    for (var k = 0; k < chosen.length; k++) files.push(chosen[k]);
    input.value = '';
    var skip = input.dataset.skip === '1';
    var skipped = 0;
    var failed = 0;
    var lastErr = '';
    var i = 0;
    var reentered = false;   // the mode was asked for again ONCE after a not_active refusal - see xhr.onload
    /* Per file, for the whole batch: how many attempts it has had, how many of those went NOWHERE, and the figure
       the device could vouch for at its last failure.  That last one is what decides whether a retry is counted -
       see retryWholeFile(). */
    var tries = {};
    var stalledTries = {};
    var progressAt = {};
    // name -> the byte offset the device can VOUCH for in that file; the next attempt sends only f.slice(landed).
    var landedAt = {};
    state.batch = true; // holds the idle redirect and keepAlive() for the whole batch, not just one file
    // The mode may have timed out while this page sat idle (its clock is three minutes), so a batch started after a
    // quiet spell would meet a closed manager on its FIRST file. The not_active branch in xhr.onload is the other half.
    // A refused re-entry (no card) takes the page back to "/" instead of starting a batch that cannot run.
    reenterManager();

    // Send one file again FROM THE START: the device cannot put back bytes it no longer holds, but the BROWSER still
    // has them, and the failures are per-TRANSFER rather than a rate. A fresh attempt has a real chance.
    // THE BUDGET COUNTS ATTEMPTS THAT WENT NOWHERE, NOT ATTEMPTS: resume-on-retry means every attempt that advanced
    // the verified position did real work, so giving up there throws away the progress just made. A retry whose figure
    // moved by PROGRESS_BYTES or more is FREE; one that gained less spends one of MAX_STALLED_TRIES. MAX_ATTEMPTS
    // bounds the loop whatever happens.
    var PROGRESS_BYTES = 32768;
    var MAX_STALLED_TRIES = 3;
    // The attempt ceiling SCALES WITH THE FILE: a budget card advances ~256 KB per attempt before refusing, so a 10 MB
    // file needs ~40 attempts. The guard that ends a hopeless file is MAX_STALLED_TRIES, which is size-independent.
    var MAX_ATTEMPTS = 8;
    var ATTEMPT_BYTES = 262144;
    var MAX_ATTEMPTS_HARD = 200;
    function attemptCeiling(size) {
      var cap = Math.max(MAX_ATTEMPTS, Math.ceil((size || 0) / ATTEMPT_BYTES));
      return Math.min(cap, MAX_ATTEMPTS_HARD);
    }
    // Reasons that mean the file is not on the card and is worth sending again: the device refused a write it could
    // not repair, or caught the card falling behind. A refusal this page caused itself is deliberately not in here.
    var RETRYABLE = { write_failed: 1, card_lagging: 1, cut_off: 1, bad_response: 1, resume_refused: 1 };
    // The subset that blames the CARD: when one of these exhausts the retry budget the WHOLE BATCH is abandoned, since
    // a card that cannot finish one file will not finish the next. bad_response is a network hiccup and is not here.
    var CARD_FAULT = { write_failed: 1, card_lagging: 1, cut_off: 1, resume_refused: 1 };
    function retryWholeFile(name, size) {
      var had = tries[name] || 0;
      if (had >= attemptCeiling(size)) return false;
      // The figure is read BEFORE the attempt is counted, and kept for the next failure of this name: what matters is
      // the step this attempt made. A failure with no figure at all is counted as having gone nowhere.
      var figure = landedAt[name] || 0;
      var moved = figure - (progressAt[name] || 0);
      tries[name] = had + 1;
      progressAt[name] = figure;
      if (moved >= PROGRESS_BYTES) return true;
      var stalled = stalledTries[name] || 0;
      if (stalled >= MAX_STALLED_TRIES) return false;
      stalledTries[name] = stalled + 1;
      return true;
    }

    // A failed transfer's handle stays open until the device's own stall branch closes it, which is also when the
    // resume offset is recorded. A retry sent before that would be taken as a FRESH file and corrupt the target, so
    // the retry asks first. In the ordinary case this costs one cheap request.
    var RELEASE_WAIT_MS = 20000;
    function waitForRelease(f, then) {
      var deadline = Date.now() + RELEASE_WAIT_MS;
      (function ask() {
        fetch('/sdman/info?up=1&ts=' + Date.now())
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j && j.ok && !j.open) { then(); return; }
            if (Date.now() < deadline) { window.setTimeout(ask, 1000); return; }
            // It refused to let go. Sending the whole file is still CORRECT - a fresh request truncates before it
            // writes - so the batch keeps moving. The offset goes with it: the device would refuse one it cannot vouch for.
            delete landedAt[f.name];
            then();
          })
          .catch(function () {
            if (Date.now() < deadline) { window.setTimeout(ask, 1000); return; }
            delete landedAt[f.name];
            then();
          });
      })();
    }

    // One summary for the whole batch, with the same two keys whatever the count is; the last failure's reason rides
    // along so a number is never left unexplained. Nothing is reported per file: the slot holds one message.
    function uploadSummary() {
      var parts = [];
      if (failed) {
        parts.push(t('msg_files_upload_failed', '{0} files failed to upload.', failed)
                   + (lastErr ? ' ' + errText(lastErr) : ''));
      }
      if (skipped) parts.push(t('msg_files_upload_skipped', '{0} files skipped (already exist).', skipped));
      if (parts.length) notice(parts.join(' '), failed > 0);
    }

    function done() {
      state.uploading = false;
      state.batch = false;
      busy(false);
      uploadSummary();
      load(state.path, true);
    }

    function next() {
      var f, label;
      for (;;) {
        if (i >= files.length) { done(); return; }
        f = files[i++];
        // Skip Existing is decided HERE, against the folder already on screen, so a name that is already there costs
        // no transfer - the browser commits the whole body before the answer comes back. The device still checks too,
        // which covers a name created since the listing was fetched.
        // ...but never for a file we hold a resume offset for: the copy that "already exists" is the half-written one
        // the DEVICE kept for this retry, so skipping it throws away the cheap path.
        if (skip && !landedAt[f.name] && existsInFolder(f.name)) { skipped++; continue; }
        /* The position in the batch, so a long upload set says where it is: the headline reads "Uploading 2/32". */
        label = i + '/' + files.length;
        break;
      }
      var xhr = new XMLHttpRequest();
      // Every way this file's request can end lands in finish(): a response, a dropped connection, a timeout, our own
      // abort. state.uploading is cleared on all of them - it dims the button row and blocks the idle redirect.
      var ended = false;
      var stalled = false;   // the progress watchdog aborted this file, so onabort must retry rather than count it out
      var deviceLost = false; // the device said the transfer is lost: the abort came from us, and the retry resumes
      var probing = false;    // one device poll in flight at a time
      var watch = 0;
      function stopWatch() { if (watch) { window.clearInterval(watch); watch = 0; } }
      // The device knows the instant a transfer is lost, and without this the page would not learn it until the
      // request ENDED - the whole cost of a failure, as the browser keeps pushing bytes that are all dropped.
      function pollDevice() {
        if (probing || ended) return;
        probing = true;
        fetch('/sdman/info?up=1&ts=' + Date.now())
          .then(function (r) { return r.json(); })
          .then(function (j) {
            probing = false;
            if (ended || !j || !j.ok || !j.lost) return;
            // The offset belongs to a NAME: a late answer must never be written into another file's resume slot.
            var base = String(j.up || '');
            if (base.slice(base.lastIndexOf('/') + 1) !== f.name) return;
            if (j.landed) landedAt[f.name] = j.landed;
            deviceLost = true;
            // Freeze on what the CARD holds: from here the request is being thrown away, so showing what the browser
            // pushed would be a lie - and the retry's bar starts from this figure.
            busyUpload(label, f.name, Math.round((j.landed || 0) * 100 / f.size) + '%');
            xhr.abort();   // onabort reports write_failed, which is retryable, so only the remainder goes up
          })
          .catch(function () { probing = false; });
      }
      // THE CARD COULD NOT FINISH THIS FILE, SO IT WILL NOT FINISH THE REST: stop the batch and say so rather than
      // grinding through the rest. done() releases everything a batch owns, so the message is set AFTER it.
      function cardFault(reason) {
        var name = f ? f.name : '';
        /* ESCAPED, since a filename is not ours and this notice goes into the slot as text. */
        var where = name ? ' (' + esc(name) + ')' : '';
        done();
        // The plain answer: there is no verdict to give, and the reason is already named in the device's own log.
        notice(t('msg_write_failed', 'The card refused a write - it may be full or faulty.') + where, true, true, true);
      }
      function finish(err, stop) {
        if (ended) return;
        ended = true;
        stopWatch();
        // The device refused an offset it could not vouch for - the transfer it belonged to had already been released,
        // so the retry must be the WHOLE file: forgetting the figure is what makes it that.
        if (err === 'resume_refused') delete landedAt[f.name];
        // A retryable failure is not a failure yet: the same file goes up again from the figure the device vouched
        // for, and the budget it spends is counted by PROGRESS, not by attempts. Everything funnels through here.
        if (err && !stop && RETRYABLE[err] && retryWholeFile(f.name, f.size)) {
          // Nothing goes into the message slot here: a failure about to be resumed is not news, and the slot holds one
          // line. The recovery is visible in the bar, which falls to the figure the card holds and climbs from there.
          state.uploading = false;
          /* i-- so next() picks the same file.  The wait is what makes that resume legal - see waitForRelease. */
          waitForRelease(f, function () { i--; next(); });
          return;
        }
        if (err) {
          failed++; lastErr = err;
          // The retry budget is spent and the CARD is the reason: there is no hope for this file, and none behind it.
          if (CARD_FAULT[err]) { cardFault(err); return; }
        }
        state.uploading = false;
        if (stop) { done(); return; }
        next();
      }
      // Resume: send only what the device does not already have, when it has told us a position it can vouch for. The
      // slice is taken here, so the device's side is one parameter, and the file still goes up as ONE request. A stale
      // figure falls back to the whole file.
      var from = landedAt[f.name] || 0;
      if (!(from > 0) || from >= f.size) from = 0;
      xhr.open('POST', '/sdman/upload?path=' + enc(state.path) + '&name=' + enc(f.name)
                + (skip ? '&skip=1' : '') + (from ? '&offset=' + from : ''));
      var lastMove = Date.now();
      xhr.upload.onprogress = function (e) {
        lastMove = Date.now();
        if (!e.lengthComputable) return;
        // The bar counts what the FILE has, not what this request has: a resumed attempt is a slice, so its own
        // loaded/total starts at nothing and the bar would fall back on every retry.
        var done = from ? from + e.loaded : e.loaded;
        var whole = from ? f.size : e.total;
        busyUpload(label, f.name, Math.round(done * 100 / whole) + '%');
      };
      xhr.onload = function () {
        var j = { ok: false, error: 'bad_response' };
        try { j = JSON.parse(xhr.responseText); } catch (e) {}
        if (j.ok && j.skipped) skipped++;   // the race case: the device refused it after all
        // Remember what the device can vouch for, so a retry costs the remainder instead of the whole file.
        if (!j.ok && j.landed) landedAt[f.name] = j.landed;
        // A card that is gone cannot take the batch: the page leaves through leaveManager() and the batch ends.
        if (!j.ok && j.error === 'no_card') { leaveManager(); return; }
        // THE MODE HAD ENDED UNDER THE BATCH - usually its own idle timeout, since the manager lives only while
        // requests arrive. The LISTING has always recovered by asking for the mode again; the UPLOAD used to end the
        // whole batch. So it does what the listing does: ask once and send this file again - nothing of it was written.
        if (!j.ok && j.error === 'not_active' && !reentered) {
          reentered = true;
          reenterManager().then(function (opened) {
            if (!opened) { finish('', true); return; }   // no card: the mode cannot come back, so the batch is over
            i--;          // the same file again: the refusal happened before any chunk was stored
            next();
          });
          return;
        }
        if (!j.ok && j.error === 'not_active') {
          notice(errText('not_active'), true);
          finish('', true);
          return;
        }
        finish(j.ok ? '' : j.error, false);
      };
      xhr.onerror = function () {
        // A dropped connection used to end the whole batch; it is now just another retryable failure, decided by
        // finish(), so this and the card-side failures share one rule. The retry runs from a timer, so this attempt is
        // over before the next starts - the device keeps ONE open handle.
        finish('bad_response', false);
      };
      // These exist so a batch can never be left half-alive: an abort or timeout that only reached the console used to
      // leave state.uploading set and the overlay up for ever.
      xhr.ontimeout = function () { finish('bad_response', false); };
      xhr.onabort   = function () {
        // Two callers abort here and the reason decides the retry: the device poll saw the transfer lost, so
        // write_failed and the retry resumes from the figure given; the progress watchdog gave up on a stalled
        // transfer, so cut_off. Either way one file goes up again and the batch carries on.
        finish(deviceLost ? 'write_failed' : (stalled ? 'cut_off' : ''), false);
      };
      busyUpload(label, f.name, '0%');
      var fd = new FormData();
      fd.append('file', from ? f.slice(from) : f, f.name);
      // A watchdog on PROGRESS, because there is no event for "the transfer has stopped moving": the device does not
      // answer until the last byte, so xhr.timeout cannot see it and nothing else fires.
      watch = window.setInterval(function () {
        if (ended) { stopWatch(); return; }
        if (!deviceLost) pollDevice();   // ends the transfer the moment the device says it is lost
        if (Date.now() - lastMove < UPLOAD_STALL_MS) return;
        stalled = true;
        xhr.abort();          // onabort above decides between the retry and giving the file up
      }, 2000);
      state.uploading = true;   // set before send, so the countdown cannot fire over the transfer
      xhr.send(fd);
    }

    next();
  }

  // Case-insensitive test against the folder on screen: FATFS compares names case-insensitively, so "SONG.MP3" and
  // "song.mp3" are one file. A directory of the same name counts too, because sdman.exists does not care which it is.
  function existsInFolder(name) {
    var want = String(name).toLowerCase();
    for (var k = 0; k < state.entries.length; k++) {
      var e = state.entries[k];
      if (e && String(e.n).toLowerCase() === want) return true;
    }
    return false;
  }
  // The document-level keepAlive() reports the picker's wait, so these two only have to start the transfer.
  $('sdmanupload').onchange = function () { startUpload(this); };
  $('sdmanuploadskip').onchange = function () { startUpload(this); };

  function toggleSort(key) {
    if (state.sortKey === key) state.sortDir = -state.sortDir;
    else { state.sortKey = key; state.sortDir = 1; }
    sortEntries();
    render();
    $('pleditorcontent').scrollTop = 0;
  }
  $('sdmanSortName').onclick = function () { toggleSort('n'); };
  $('sdmanSortSize').onclick = function () { toggleSort('s'); };

  // Done closes the mode on the device and hands "/" back - the player in station mode, the AP settings page with no
  // network. The answer has to be read rather than assumed: the device refuses while a file is mid-write, so a 200
  // means closed and anything else means refused with the reason in the body.
  $('sdmanDone').onclick = function () {
    fetch('/sdman/done', { method: 'POST' }).then(function (r) {
      if (r.ok) { window.location.replace('/'); return; }
      return r.json().then(function (j) { notice(errText(j.error), true); },
                           function () { notice(errText('bad_response'), true); });
    }).catch(function () { window.location.replace('/'); });
  };

  // locale.js fetches locale.json and then calls applyI18n(); the tooltips are built with t() as the rows render, so
  // wrap it to re-render once translations arrive. Skipped while anything is ticked, so a selection is not thrown away.
  var _applyI18n = window.applyI18n;
  window.applyI18n = function (root) {
    if (typeof _applyI18n === 'function') _applyI18n(root);
    if (state.entries.length && !selection().length) render();
  };

  // Follow the device instead of polling it: the manager's own open/closed state arrives on the WebSocket the player
  // page already uses, so an ejection, Done, the idle timeout, or a close driven from another tab moves this tab too,
  // with no request of its own. The 0 is honoured only once a 1 has been seen - the connect-time push reports the
  // state as it is, and a socket that comes up a moment before /sdman/enter would otherwise bounce the user straight
  // back out. If the socket never opens, every action still answers no_card and this page follows on that instead.
  var managerWasOpen = false;
  try {
    var sock = new WebSocket('ws://' + window.location.host + '/ws');
    sock.onmessage = function (e) {
      var j;
      try { j = JSON.parse(e.data); } catch (err) { return; }
      if (typeof j.sdmanactive === 'undefined') return;
      if (j.sdmanactive) { managerWasOpen = true; return; }
      if (managerWasOpen) leaveManager();
    };
  } catch (err) { /* no push here: the no_card paths above still return the page when the card goes */ }

  // Open the mode and stay on this address - the device redirects "/" here while the mode is open, so there is no
  // hand-over to the root. The listing always starts at the card's root.
  fetch('/sdman/enter').then(function (r) { return r.json(); }).catch(function () {
    return { ok: false, error: 'bad_response' };
  }).then(function (j) {
    if (!j.ok) {
      // Arriving with no card is refused by the device: back to "/" rather than showing a manager that cannot work.
      if (j.error === 'no_card') { leaveManager(); return; }
      notice(errText(j.error), true);
      return;
    }
    return load('/').then(loadInfo);
  });
})();
</script>
</body>
</html>
